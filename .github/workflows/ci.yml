name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install '.[test]' -r clients/qwen/requirements.txt
      - name: Test restrictive umask
        run: |
          umask 077
          python -m pytest -q
      - name: Build wheel and sdist
        run: python -m build
      - name: Verify package outside source tree
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          python -c 'from mcp_rooms.server import create_app; from mcp_rooms.identity import IdentityStore; from mcp_rooms.listing_contract import ListingContent; from mcp_rooms.draft_store import DraftStore; from mcp_rooms.domain import Principal; from mcp_rooms.preview_contract import make_preview'
